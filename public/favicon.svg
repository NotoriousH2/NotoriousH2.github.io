<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #b3b3b3; }
    .dot { fill: #4a5bd4; }
    .ring { fill: none; stroke: #4a5bd4; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a1a; }
      .line { stroke: #4d4d4d; }
      .dot { fill: #9aa8ff; }
      .ring { stroke: #9aa8ff; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <g class="line" stroke-width="1.4" stroke-linecap="round">
    <line x1="9" y1="10" x2="16" y2="21"/>
    <line x1="23" y1="10" x2="16" y2="21"/>
    <line x1="9" y1="10" x2="23" y2="10"/>
  </g>
  <circle class="dot" cx="9" cy="10" r="2.6"/>
  <circle class="dot" cx="23" cy="10" r="2.6"/>
  <circle class="ring" cx="16" cy="21" r="3.6" stroke-width="1.8"/>
</svg>
